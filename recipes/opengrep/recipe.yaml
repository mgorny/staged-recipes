# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.25.0"
  ocaml_ts_core: fb72747f328c156b6c8f3b8bea74454190576e04

package:
  name: opengrep
  version: ${{ version }}

source:
  - url: https://github.com/opengrep/opengrep/archive/refs/tags/v${{ version }}.tar.gz
    sha256: b7c157f226d67c01e79199eb967885caf50f2b7e971c36e61fdaccf888753c1c
  - url: https://github.com/opengrep/ocaml-tree-sitter-core/archive/${{ ocaml_ts_core }}.tar.gz
    sha256: 1a5da1da7fb411bd0ef0b88d992237ed8b0953eb2bcf07abfd8954f77275a068
    target_directory: libs/ocaml-tree-sitter-core/

build:
  number: 0

requirements:
  build:
    - make
    - ocaml ==5.3.0
    - opam
    - pkg-config
  host:
    - libtree-sitter
    - pcre
    - pcre2
    # ocaml dependencies
    - libffi
    - gmp
    - libev
  run:

about:
  summary: Static code analysis engine to find security issues in code
  license: LGPL-2.1-only
  license_file:
    - COPYING
    - LICENSE
  homepage: https://github.com/opengrep/opengrep

extra:
  recipe-maintainers:
    - mgorny
